name: Jiangniu v1.1.0 - Android APK

on:
  push:
    branches:
      - jiangniu-v1.1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jiangniu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build, test and verify installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already provide Android command-line tools.
      # android-actions/setup-android@v3 installs obsolete SDK package "tools" on
      # this runner image, so use the preinstalled current sdkmanager directly.
      - name: Install Android SDK 36 and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          printf 'y\n%.0s' {1..80} | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check artwork and Chinese text
        shell: bash
        run: |
          python -m pip install Pillow
          python tools/check_cow_assets.py

      - name: Test and build signed debug APK
        shell: bash
        run: |
          bash ./gradlew --no-daemon \
            :core:test \
            :android:assembleDebug \
            :android:assembleDebugAndroidTest \
            :android:lintDebug

      - name: Verify APK contents, alignment and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/build/outputs/apk/debug/android-debug.apk"
          test -s "$APK"
          python3 tools/check_apk.py "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK missing}}"
          "$SDK/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"

          "$SDK/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          EXPECTED_CERT="5c09895ed947c7f965480468dcc026af0d3a4686fcbc910d0ec5eead57a15a00"
          grep -Fqi "$EXPECTED_CERT" apk-signature.txt

          mkdir -p dist
          cp "$APK" dist/Jiangniu-v1.1.0.apk
          (cd dist && sha256sum Jiangniu-v1.1.0.apk > SHA256SUMS.txt)
          cp apk-signature.txt dist/signature.txt
          ls -lh dist

      - name: Upload directly installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Jiangniu-v1.1.0-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jiangniu-v1.1.0-test-reports
          path: |
            core/build/test-results/test/
            android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30

  publish-release:
    name: Publish directly downloadable Android APK
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Jiangniu-v1.1.0-APK
          path: dist

      - name: Create or refresh Jiangniu APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="jiangniu-v1.1.0-apk"
          test -s dist/Jiangniu-v1.1.0.apk
          (cd dist && sha256sum --check SHA256SUMS.txt)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Jiangniu-v1.1.0.apk dist/SHA256SUMS.txt dist/signature.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              dist/Jiangniu-v1.1.0.apk dist/SHA256SUMS.txt dist/signature.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "犟牛地牢 v1.1.0 · Android APK" \
              --notes "由 GitHub Actions 构建并验证的 Android 可直接安装 APK。包名 com.jarvistowne.jiangniu，versionCode 1100。采用仓库中的公开体验版签名（不是商店级发布密钥）；与使用相同签名的 v1.0.0 可覆盖升级。请下载 APK，不需要下载源码 ZIP。校验值及签名记录见同一 Release 附件。" \
              --prerelease
          fi
