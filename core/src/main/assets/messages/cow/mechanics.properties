# 犟牛专属玩法；所有语言均使用中文回退。
items.weapon.melee.oxhorn.name=犟角
items.weapon.melee.oxhorn.desc=两枚磨得发亮的角尖固定在短柄上。它很小，脾气很大。\n\n犟牛使用时，每累积3点倔劲增加1点伤害，每升6级再增加1点伤害。它可升级与附魔，并随着犟牛历练逐步磨合；进化会将本命武器的实际阶级从1阶逐步提升至4阶，升级成长系数与力量需求同步变化。原有强化和附魔不会丢失，但也不会产生免费的强化等级。
items.weapon.melee.oxhorn.ability_name=倔强一击
items.weapon.melee.oxhorn.ability_desc=犟角只回应犟牛的倔劲。
items.weapon.melee.oxhorn.typical_ability_desc=犟角只回应犟牛的倔劲。

items.artifacts.cowbell.name=不服铃
items.artifacts.cowbell.desc=一件放在背包中就能使用的本命神器，不占饰品栏。它随历练进化，升级卷轴不能替代实战。\n\n_顶撞_：耗3倔劲，接近直线3格内的可见敌人，造成4＋英雄等级＋移动格数×2点物理伤害，残废3回合。路径受墙、深渊、其他生物阻挡，沿途照常触发地形与陷阱。\n\n_踏地_：耗3倔劲，对相邻敌人造成3＋英雄等级÷2点物理伤害与2回合残废；自己获得2＋英雄等级÷5点、持续4回合的守牧护盾。天赋可进一步调整。\n\n两招均耗1回合。空放不涨历练，取消或无效顶撞不扣资源。进化效果见下方；成长条件和彩蛋相册均可在道具菜单查看。
items.artifacts.cowbell.ac_charge=顶撞
items.artifacts.cowbell.ac_stomp=踏地
items.artifacts.cowbell.not_cow=铜铃轻轻晃了晃：这份倔强似乎不属于你。
items.artifacts.cowbell.no_charge=还需要至少%d点倔劲。先好好打一场，再响铃吧。
items.artifacts.cowbell.rooted=蹄子被缠住了，暂时无法顶撞。你仍然可以踏地。
items.artifacts.cowbell.prompt=选择直线路径内的可见敌人进行顶撞
items.artifacts.cowbell.bad_target=顶撞需要范围内的可见敌人，以及没有墙壁、深渊或其他生物阻挡的直线路径。

items.armor.cowhidearmor.name=拼斑围兜
items.armor.cowhidearmor.desc=一件照着黑白斑纹缝成的厚布围兜。胸前口袋除了饼干屑，偶尔也会装进不属于自己的工作。\n\n犟牛穿着时，倔劲不少于3点便额外抵挡1点敌方普通攻击伤害。它从1阶围兜逐渐进化成4阶重甲，真实防御及力量需求随之提高；升级和刻印保留。

items.food.warmmilk.name=温热牛乳
items.food.warmmilk.ac_eat=喝牛乳
items.food.warmmilk.desc=瓶壁还留着一点暖意。饮用后提供半份口粮的饱腹感，并获得_反刍_：每回合回复1点生命，总计5点。连续饮用只保留较大的剩余治疗量，不会无限叠加。\n\n药水恐惧挑战下只提供食物效果。
items.food.warmmilk.eat_msg=温热的牛乳落进肚子里。倔强，也可以慢慢来。
items.food.meadowcake.name=口袋草饼
items.food.meadowcake.ac_eat=吃草饼
items.food.meadowcake.desc=你明明没有带这块饼，却从围兜口袋里摸到了它。上面印着一枚歪歪的小蹄印。\n\n提供半份口粮的饱腹感，并获得4点、持续8回合的守牧护盾。
items.food.meadowcake.eat_msg=草饼咔嚓一响。这里，暂且就算牧场吧。

actors.buffs.stubbornness.name=倔劲
actors.buffs.stubbornness.heromsg=
actors.buffs.stubbornness.desc=你目前有_%d/%d_点倔劲。\n\n普通攻击命中敌人或实际承受敌人伤害时，获得1点倔劲。不服铃的顶撞和踏地各消耗3点。等待、饥饿和毒素不会产生倔劲。\n\n倔劲随存档保留，不会自然消散。
actors.buffs.stubbornness.welcome=你刚把鼠标放下，小牛就自己走进了地牢。铜铃轻响：别担心，这次我来带路。
actors.buffs.stubbornness.meadow=你踩过第八簇高草，忽然从围兜里摸到一块草饼。地牢地图没有牧场，所以小牛自己带了一小块。
actors.buffs.stubbornness.convergence=第六十四次倔强终于收敛。小牛宣布：“没有虚频，只有不服！”你获得了一层小小的守牧护盾。
actors.buffs.cowguard.name=守牧
actors.buffs.cowguard.heromsg=
actors.buffs.cowguard.desc=一圈温柔而固执的守护罩在你身上。\n\n剩余护盾：_%d_点。\n剩余时间：_%d_回合。\n\n重复获得守牧只保留较高的护盾与较长的时间，不会把护盾直接相加。
actors.buffs.cowrush.name=余势
actors.buffs.cowrush.heromsg=
actors.buffs.cowrush.desc=冲锋的余势还留在双角之间。下一次命中敌人的普通攻击增加_%d_点伤害，随后消失。\n\n剩余时间：_%s_回合。
actors.buffs.rumination.name=反刍
actors.buffs.rumination.heromsg=
actors.buffs.rumination.desc=把日子嚼慢一点，伤口也就好得稳一点。\n\n每回合回复1点生命，剩余最多_%d_点。生命已满时仍消耗当回合的治疗量。不能无限叠加，药水恐惧挑战会阻止这种治疗。
actors.buffs.nightshift.name=夜班精神
actors.buffs.nightshift.heromsg=
actors.buffs.nightshift.desc=窗外天黑了，小牛的台灯还亮着。\n\n移动速度提高50%%，普通攻击获得额外伤害，法杖充能与照明同时生效。\n\n剩余时间：_%s_回合。
actors.buffs.pasturefield.name=方寸牧场
actors.buffs.pasturefield.heromsg=
actors.buffs.pasturefield.desc=你的蹄印圈出了一片临时牧场。它固定在施法位置，不会随着你移动。墙壁会阻断它的影响。\n\n剩余_%d_回合；半径_%d_格；单个守牧护盾上限_%d_点。\n\n场内敌人残废，友方每3回合恢复少量守牧护盾。切换楼层或支线后牧场立即失效。

actors.hero.abilities.cow.stampede.name=万蹄奔雷
actors.hero.abilities.cow.stampede.short_desc=把奔蹄的回声送向远处，震伤直线上的所有敌人。
actors.hero.abilities.cow.stampede.desc=向选定方向发出一列贯穿生物的蹄声冲击，最多行进5格，遇墙停止。沿线敌人受到10＋英雄等级点物理伤害并残废4回合。\n\n这是一道向前奔涌的冲击，犟牛本人留在原处。
actors.hero.abilities.cow.stampede.cost=消耗_%d_点护甲能量，施放需要1回合。
actors.hero.abilities.cow.stampede.prompt=选择万蹄奔雷的方向
actors.hero.abilities.cow.stampede.bad_target=请选择视野内能够向前延伸的方向。
actors.hero.abilities.cow.pastureward.name=方寸牧场
actors.hero.abilities.cow.pastureward.short_desc=划出一片固定的守护区域，让敌人寸步难行，让伙伴有所依靠。
actors.hero.abilities.cow.pastureward.desc=以当前位置为中心，建立半径2格、持续8回合的牧场。场内的你和友方立即获得8＋英雄等级÷2点守牧护盾。牧场每3回合恢复1点守牧护盾，不能超过初始上限；敌人在场内持续受到残废。\n\n牧场固定在施法位置，墙壁会阻断其影响。切换楼层或支线后失效。
actors.hero.abilities.cow.pastureward.cost=消耗_%d_点护甲能量，施放需要1回合。
actors.hero.abilities.cow.midnightsun.name=夜半开工
actors.hero.abilities.cow.midnightsun.short_desc=点亮小小的台灯，让移动、攻击和法杖一起进入工作状态。
actors.hero.abilities.cow.midnightsun.desc=立即获得2点倔劲，并进入持续8回合的夜班精神：移动速度提高50%，普通攻击额外造成1点伤害，同时获得照明与法杖充能。\n\n灯是暖的，眉毛还是那么倔。
actors.hero.abilities.cow.midnightsun.cost=消耗_%d_点护甲能量，施放需要1回合。
actors.hero.abilities.cow.midnightsun.cast=四蹄并行，今晚准点收工。

# 犟牛 v1.1.0：成长、熟练度与一次性趣事。
actors.buffs.cowlegend.name=犟牛历练
actors.buffs.cowlegend.heromsg=
actors.buffs.cowlegend.stage_0=初出牛棚
actors.buffs.cowlegend.stage_1=熟练工牛
actors.buffs.cowlegend.stage_2=犟角行家
actors.buffs.cowlegend.stage_3=老牌犟牛
actors.buffs.cowlegend.evolved=犟牛进化为_%s_！牛角和护甲真正提升了阶级，旧的强化、刻印和附魔依然保留。
actors.buffs.cowlegend.progress=当前成长：_%s_，历练_%d_。下一阶段需要至少_%d历练_与_英雄等级%d_；两项条件都满足时自动进化。
actors.buffs.cowlegend.complete=当前成长：_%s_，历练_%d/%d_。已完成全部进化，装备仍可正常升级。
actors.buffs.cowlegend.desc=有效普通攻击与实际承受敌人直接伤害各积累1历练；牛铃技能命中敌人积累2历练，每次施放只结算一次；有效英雄护甲能力积累3历练。等待与空放不会增长历练。\n\n当前围兜黑锅：_%d/%d_；卸锅护盾冷却：_%d回合_。围兜的黑锅只在穿着专属围兜或星牧战铠时生效；脱下后清空。它不会反射伤害，也不会凭空产生倔劲。
actors.buffs.cowlegend.third_hit=小牛敲了敲角锤：“第三点，我还没说完。”
actors.buffs.cowlegend.unload=小牛把黑锅推了回去：“这事儿不归牛管。”
items.weapon.melee.oxhorn.name_1=钢筋抬杠锤
items.weapon.melee.oxhorn.name_2=破阵牛角战锤
items.weapon.melee.oxhorn.name_3=星陨犟天锤
items.weapon.melee.oxhorn.stage_0=_牛角短锤／1阶_：初始伤害2～8，强化每级提升1～2点。12历练与3级进化为钢筋抬杠锤。
items.weapon.melee.oxhorn.stage_1=_钢筋抬杠锤／2阶_：真实提升为2阶武器，伤害3～12，强化每级提升1～3点；每第三次有效命中额外造成4点伤害。
items.weapon.melee.oxhorn.stage_2=_破阵牛角战锤／3阶_：真实3阶，伤害4～16；每第三击追加6伤害与2回合残废。物理系成长，仍需面对更强的地牢敌人。
items.weapon.melee.oxhorn.stage_3=_星陨犟天锤／4阶_：真实4阶，伤害5～20，强化每级提升1～5点；每第三击追加8伤害、残废、易伤与短暂眩晕，并获得2点短时守牧护盾。
items.armor.cowhidearmor.name_1=铁皮值班围兜
items.armor.cowhidearmor.name_2=不背锅重甲
items.armor.cowhidearmor.name_3=星牧牛王铠
items.armor.cowhidearmor.stage_0=_拼斑围兜／1阶_：在倔劲不少于3时额外抵挡1点普通敌方攻击；12历练与3级进化为铁皮围兜。
items.armor.cowhidearmor.stage_1=_铁皮值班围兜／2阶_：防御阶级真正升至2；敌方直接伤害可积攒最多2层黑锅，下一次有效攻击卸下，最多+2伤害。
items.armor.cowhidearmor.stage_2=_不背锅重甲／3阶_：真实3阶防御；黑锅最多3层，每次卸下2层获得1点短盾（8回合冷却）；对较重的直接伤害另有少量减免。
items.armor.cowhidearmor.stage_3=_星牧牛王铠／4阶_：真实4阶防御；黑锅最多4层，每次卸下2层获得2点短盾（8回合冷却）；较重的直接伤害可额外减免最多2点。
items.armor.cowarmor.inheritance=星牧战铠保留皇冠所升级护甲的强化与刻印，实际阶级不会低于当前专属护甲进化阶级，也不会降低已转移的更高阶级，并继承围兜当前成长阶段的有限卸锅机制，以及倔劲充足时抵挡1点敌方普通攻击伤害的特性。
items.artifacts.cowbell.name_0=不服铃
items.artifacts.cowbell.name_1=申诉小铃
items.artifacts.cowbell.name_2=调解牛铃
items.artifacts.cowbell.name_3=主持公道铃
items.artifacts.cowbell.stage_0=_初始阶段_：顶撞用于接敌，踏地用于近身群攻与短时守护。小铃的声量有限，意见倒是很大。成长条件可查看“成长手册”。
items.artifacts.cowbell.stage_1=_一阶进化_：顶撞至少移动1格并造成伤害后，令目标虚弱1回合。只是让对方稍微冷静一下，并不会阻止它行动。
items.artifacts.cowbell.stage_2=_二阶进化_：保留一阶效果。6回合内交替使用两次命中敌人的顶撞、踏地，触发一次配合：顶撞接踏地使本次基础护盾多2点；踏地接顶撞使本次冲击多2点伤害。配合后窗口消失，同招连用无奖励；护盾不无限叠加。
items.artifacts.cowbell.stage_3=_三阶进化_：保留前两阶效果，解锁“据理力争”。消耗4点倔劲和1回合，对2格内可见且声音不被墙阻挡的敌人造成2＋英雄等级÷4点物理伤害，并施加3回合虚弱；首领与小头目仅1回合。伤害较低，适合应对围攻；该技能不触发连招。没有听众时不扣资源。
items.artifacts.cowbell.ac_debate=据理力争
items.artifacts.cowbell.ac_guide=成长手册
items.artifacts.cowbell.progress_empty=当前历练：0；初始阶段。下一阶段需要12点历练与英雄等级3。
items.artifacts.cowbell.guide=_牛铃成长手册_\n\n%s\n\n_12历练／3级_：申诉小铃。移动后顶撞命中，附加1回合虚弱。\n_40历练／8级_：调解牛铃。6回合内交替命中，获得有限伤害或护盾奖励。\n_90历练／14级_：主持公道铃。解锁耗4倔劲的短程防守声波。\n\n普通有效命中或敌方直接伤害积累历练；牛铃每次实际伤害敌人额外获得2点。等待与空放不成长，查看手册不耗回合。
items.artifacts.cowbell.combo_charge=牛铃清了清嗓子：刚才那个问题，我还有一点补充。
items.artifacts.cowbell.combo_stomp=犟牛把地板当会议桌敲了两下：此事就按我说的再议！
items.artifacts.cowbell.no_audience=犟牛宣布开会。出席者：犟牛。会议暂缓，倔劲原样保留。
items.artifacts.cowbell.debate_cast=哞——！会议纪要：双方都觉得对方没有听懂。
items.artifacts.cowbell.ac_album=牛言牛语
actors.buffs.cowbellcombo.name=话还没说完
actors.buffs.cowbellcombo.desc=还有%s回合可以补充发言。\n\n下一次有效%s。配合触发后窗口消失，必须重新开始；原地等候、空放技能与重复同招均不能获得奖励。
actors.buffs.cowbellcombo.follow_stomp=踏地可让本次基础护盾多2点，较强护盾不会叠加
actors.buffs.cowbellcombo.follow_charge=顶撞可让本次冲击多2点伤害
actors.buffs.cowbellcombo.heromsg=
actors.buffs.cowcraft.name=犟牛技能笔记
actors.buffs.cowcraft.heromsg=
actors.buffs.cowcraft.desc=有效实战才能积累护甲技能熟练度。每项技能练习3、7、12次时分别进化，空放不计。
actors.buffs.cowcraft.progress=本技能熟练度：_%d/12_，进化_%d/3_。实战有效使用3、7、12次分别进化；新增效果从下一次施放生效。
actors.buffs.cowcraft.skill_0=万蹄奔雷
actors.buffs.cowcraft.skill_1=方寸牧场
actors.buffs.cowcraft.skill_2=夜半开工
actors.buffs.cowcraft.practiced=%s练熟了！小牛把操作手册合上：这次不是看起来会了。
actors.hero.abilities.cow.stampede.evolution=_排队取号_：实际伤害敌人的施放才计入熟练。练习3次后，每次首个受伤且存活的目标额外虚弱2回合；练习7次后，一次伤害至少两名敌人时，自己获得2点、持续4回合的守牧护盾。练习12次后，真正受伤的沿线敌人还会受到2回合易伤；若一次命中两名及以上敌人，返还最多6点护甲能量。没有击中便没有返还。能量费用保持不变。
actors.hero.abilities.cow.pastureward.evolution=_挂牌营业_：每次牧场中实际出现敌人时，只结算一次熟练。练习3次后，护盾上限增加2点；练习7次后，每片牧场的第三次或之后首次身在场内的脉冲，会为你清除一次残废。练习12次后，牧场半径再增加1格、护盾上限增加3点，场内敌人受到2回合虚弱。不能反复刷新治疗或奖励。
actors.hero.abilities.cow.midnightsun.evolution=_准点打卡_：每次开启夜班后，首次真正伤害敌人的普通攻击才结算熟练。练习3次后，开启时清除残废；练习7次后，持续时间增加2回合。练习12次后，再延长3回合，并清除燃烧与中毒、获得3点短盾；开启时额外获得1点倔劲。不会降低能量费用，也不会提高伤害倍率。
actors.buffs.cowjournal.name=牛言牛语
actors.buffs.cowjournal.heromsg=
actors.buffs.cowjournal.desc=一本记着地牢小事的随身册。18则趣事每则有一次实际奖励；每累计6则趣事，倔劲上限永久+1（本局最多+3）。已发现的趣事可在牛铃菜单回看。
actors.buffs.cowjournal.album=_牛言牛语：%d/%d_\n\n只记录本局已经发现的新趣事，未遇到的部分留给路上。每条最多触发一次；奖励可能是短时状态、补给或升级卷轴。每累计6则倔劲上限+1。集齐18则再奖励一瓶力量药水。
actors.buffs.cowjournal.entry_0=_泡澡不计工时_：第六次淌水后，小牛申请把冒险改成水疗。地牢回复：不报销。奖励：短暂加速3回合。
actors.buffs.cowjournal.entry_1=_门禁识别失败_：穿过第六道门，小牛认真思考：如果门再窄一点，应该扣门的工资。奖励：一张魔法地图卷轴。
actors.buffs.cowjournal.entry_2=_配料表最后一项_：第一次喝牛乳，小牛翻到瓶底：生牛乳、温柔，以及微量不服气。奖励：恢复2点倔劲。
actors.buffs.cowjournal.entry_3=_饼干屑的反抗_：第一块口袋草饼坚持要给你撑腰，附赠一次2点、持续3回合的小护盾；较强守牧仍只取较大值。
actors.buffs.cowjournal.entry_4=_冷链很完整_：冻肉冰得小牛打了个哆嗦：“这口下去，眉毛都快没有热运动了。奖励：祝福4回合。”
actors.buffs.cowjournal.entry_5=_餐补申请已驳回_：第五顿饭后，小牛郑重填写报销单。驳回原因：申请人把签名栏吃掉了。奖励：一块口袋草饼。
actors.buffs.cowjournal.entry_6=_横着走的同行_：螃蟹横着走，小牛正着犟。双方一致认为对方的职业规划有问题。奖励：恢复2点倔劲。
actors.buffs.cowjournal.entry_7=_减脂过度_：小牛敲了敲骷髅：“你这不是轻装上阵，你这是把装备栏长在外面了。奖励：祝福4回合。”
actors.buffs.cowjournal.entry_8=_箱子先开口_：小牛盯着拟态怪的牙：“原来你也是装着装着，就不想装了。奖励：治疗药水一瓶。”
actors.buffs.cowjournal.entry_9=_自动化同事_：小牛询问机器人的排班。对方用电弧回答。看来它也不想开会。奖励：充能4回合。
actors.buffs.cowjournal.entry_10=_样本量一百_：第一百次真正打疼敌人后，小牛得出统计结论：嘴硬具有显著重复性。奖励：升级卷轴一张。
actors.buffs.cowjournal.entry_11=_地下办公区_：来到监狱后，小牛看了一眼铁门：“工位隔断做得挺结实。奖励：魔法地图卷轴一张。”
actors.buffs.cowjournal.entry_12=_牛事部来访_：来到矮人都市，小牛试图找牛事部。前台表示：这里只有人事部，而且早就下班了。奖励：心灵视界药水一瓶。
actors.buffs.cowjournal.entry_13=_请按蹄印排队_：第三次练成万蹄奔雷，小牛开始给冲击波取号。当前叫号：哞零零三。奖励：恢复2点倔劲。
actors.buffs.cowjournal.entry_14=_牧场正式挂牌_：第三片实战牧场顺利开业。建筑面积：几格。经营范围：不让你过来。奖励：温热牛乳一瓶。
actors.buffs.cowjournal.entry_15=_准点收工倡议_：第三次夜班实战完成，小牛发起“今晚一定早睡”倡议。签名处只有一个蹄印。奖励：充能6回合。
actors.buffs.cowjournal.entry_16=_围兜去哪儿了_：小牛低头一看：“围兜没穿，气场得穿。”本条不提供防御，但会短暂加速3回合。
actors.buffs.cowjournal.entry_17=_最后一点体面_：受敌人攻击后只剩1点生命，小牛挤出一句“问题不大”。一次性的2点护盾撑住3回合；下次记得躲。

# 犟牛 v1.2.0：牛铃独立熟练度与真正影响局势的随机事件。
actors.buffs.cowbellmastery.name=牛铃实战熟练度
actors.buffs.cowbellmastery.heromsg=
actors.buffs.cowbellmastery.progress=_牛铃独立成长：%d/15次有效命中施放，当前%d/3阶。_ 第3次：顶撞范围+1且伤害+2；第8次：解锁一次性楼层盲盒；第15次：踏地可冲击2格（外圈半伤）且高阶顶撞可短暂震慑。
actors.buffs.cowbellmastery.evolved=牛铃熟练度进化至%d阶，开会方式又多了一个！
