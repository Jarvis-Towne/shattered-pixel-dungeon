items.artifacts.cowbell.draw_0=抽到保温饭票！牛棚送来一瓶温热牛乳。
items.artifacts.cowbell.draw_1=抽到员工餐补！领取一块口袋草饼。
items.artifacts.cowbell.draw_2=抽到工伤保险！获得5点守牧盾与返还1点倔劲。
items.artifacts.cowbell.draw_3=抽到突击检查！虚弱3回合，但补偿一瓶治疗药水。
