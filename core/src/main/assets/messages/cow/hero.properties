# 犟牛扩展：所有语言统一使用中文原创内容。
actors.hero.heroclass.cow=犟牛
actors.hero.heroclass.cow_desc_short=从桌面闯进地牢的小牛。战斗积攒_倔劲_，摇铃顶撞；越不服气，越有底气。
actors.hero.heroclass.cow_desc=犟牛携带_不服铃_。命中敌人或受到敌人直接伤害可积攒_倔劲_，用于发动顶撞与踏地。\n\n专属武器_犟角_随英雄成长，也可用升级卷轴强化。它没有在生气，只是在认真开路。\n\n初始穿着_拼斑围兜_。击败天狗后，转职为_撼地蛮牛_或_守夜牧卫_。\n\n随身带着_温热牛乳_、口粮、水袋与绒布袋。开局已鉴定鉴定卷轴、治疗药剂和盛怒卷轴。
actors.hero.heroclass.cow_unlock=犟牛开局即解锁。它自己顶开了门。

actors.hero.herosubclass.bulldozer=撼地蛮牛
actors.hero.herosubclass.bulldozer_short_desc=_撼地蛮牛_擅长顶撞开路，冲锋后的一次攻击获得额外伤害。
actors.hero.herosubclass.bulldozer_desc=撼地蛮牛把倔劲变成突破力：_顶撞伤害提高25%_，并在冲锋后强化下一次有效命中。\n\n强化攻击额外造成_2+英雄等级÷5_点伤害，等级部分向下取整；天赋还能增加这一伤害，让撞击产生余震，或在摇铃后提供护盾。\n\n冲入敌群前，先看好退路。气势不能代替护甲，深渊也不会让路。
actors.hero.herosubclass.herdguard=守夜牧卫
actors.hero.herosubclass.herdguard_short_desc=_守夜牧卫_在使用牛铃后获得守牧护盾，也能照顾身旁的伙伴。
actors.hero.herosubclass.herdguard_desc=守夜牧卫选择站在同伴身前。每次成功使用牛铃技能后，获得_3+英雄等级÷3_点守牧护盾，持续_6回合_，等级部分向下取整。\n\n转职天赋可以强化护盾、为两格内的友方提供保护，以及触发带有冷却时间的少量持续恢复。\n\n它仍然一脸不服气，只是这一次，谁也别想欺负它身后的伙伴。

actors.hero.talent.cow_hearty_ration.title=吃饱顶住
actors.hero.talent.cow_hearty_ration.desc=_+1：_进食并获得饱食度时，获得_2点护盾_。\n\n_+2：_护盾增加至_3点_。
actors.hero.talent.cow_thick_hide.title=厚脸皮
actors.hero.talent.cow_thick_hide.desc=_+1：_敌人普通攻击造成的伤害降低_5%_。\n\n_+2：_降低_10%_。\n\n减伤后的伤害向上取整；不影响独立施法伤害、饥饿或中毒。
actors.hero.talent.cow_horn_polish.title=磨亮犟角
actors.hero.talent.cow_horn_polish.desc=_+1：_使用犟角命中时，额外造成_1点伤害_。\n\n_+2：_额外伤害增加至_2点_。
actors.hero.talent.cow_stubborn_spark.title=小小倔脾气
actors.hero.talent.cow_stubborn_spark.desc=_+1：_倔劲上限增加_1点_。\n\n_+2：_倔劲上限增加_2点_。\n\n提升上限不会直接补满倔劲。

actors.hero.talent.cow_long_charge.title=再顶一步
actors.hero.talent.cow_long_charge.desc=_+1：_牛铃顶撞的最远距离增加_1格_。\n\n_+2：_增加_2格_。\n\n仍然需要可见的敌人和可通过的直线路径。
actors.hero.talent.cow_earthshaker.title=跺脚有理
actors.hero.talent.cow_earthshaker.desc=_+1：_踏地额外造成_2点伤害_，残废延长_1回合_。\n\n_+2：_额外造成_4点伤害_，残废延长_2回合_。
actors.hero.talent.cow_warm_milk.title=慢慢回甘
actors.hero.talent.cow_warm_milk.desc=_+1：_温热牛乳的持续恢复总量增加_3点_。\n\n_+2：_增加_6点_。\n\n恢复仍分多个回合生效。
actors.hero.talent.cow_steady_hooves.title=四蹄站稳
actors.hero.talent.cow_steady_hooves.desc=_+1：_成功发动踏地时，清除自身的_残废_。\n\n_+2：_还会清除自身的_缠绕_。
actors.hero.talent.cow_bell_resonance.title=叮当回响
actors.hero.talent.cow_bell_resonance.desc=_+1：_每_3次_有效命中敌人，额外获得_1点倔劲_。\n\n_+2：_每_2次_有效命中触发一次。\n\n倔劲依然受上限限制。

actors.hero.talent.cow_stamina.title=长长一口气
actors.hero.talent.cow_stamina.desc=_+1/+2/+3：_倔劲上限再增加_1/2/3点_。\n\n可与小小倔脾气叠加；提升上限不会直接补充倔劲。
actors.hero.talent.cow_resolve.title=越倔越勇
actors.hero.talent.cow_resolve.desc=_+1/+2/+3：_攻击前的倔劲至少达到当前上限的一半时，有效命中敌人额外造成_1/2/3点伤害_。\n\n本次攻击新获得的倔劲不计入判定。
actors.hero.talent.cow_rushing_force.title=犟劲追击
actors.hero.talent.cow_rushing_force.desc=_+1/+2/+3：_冲锋后的强化攻击再额外增加_2/4/6点伤害_。
actors.hero.talent.cow_aftershock.title=牛蹄余震
actors.hero.talent.cow_aftershock.desc=_+1/+2/+3：_顶撞命中后，对目标附近的敌人造成相当于本次撞击伤害_20%/40%/60%_的溅射伤害。
actors.hero.talent.cow_unstoppable.title=不服就顶
actors.hero.talent.cow_unstoppable.desc=_+1/+2/+3：_成功使用牛铃技能后，获得_2/4/6点守牧护盾_，持续_5回合_。
actors.hero.talent.cow_shared_shelter.title=靠过来一点
actors.hero.talent.cow_shared_shelter.desc=_+1/+2/+3：_成功使用牛铃技能后，为两格内的友方提供_2/4/6点守牧护盾_。\n\n护盾持续时间随守夜有方延长。
actors.hero.talent.cow_patient_watch.title=守夜有方
actors.hero.talent.cow_patient_watch.desc=_+1/+2/+3：_使用牛铃获得的守牧护盾额外增加_2/4/6点_，持续时间延长_2/4/6回合_。
actors.hero.talent.cow_gentle_recovery.title=嘴硬心软
actors.hero.talent.cow_gentle_recovery.desc=_+1/+2/+3：_生命未满时，成功使用牛铃会额外缓慢恢复_1/2/3点生命_。\n\n触发后需要等待_12回合_才能再次恢复。

actors.hero.talent.cow_long_rush.title=天边也是路
actors.hero.talent.cow_long_rush.desc=_+1/+2/+3/+4：_万蹄奔雷的最远距离增加_1/2/3/4格_。
actors.hero.talent.cow_thunder_hooves.title=雷鸣四蹄
actors.hero.talent.cow_thunder_hooves.desc=_+1/+2/+3/+4：_万蹄奔雷造成的伤害增加_15%/30%/45%/60%_。
actors.hero.talent.cow_chain_rush.title=一往无前
actors.hero.talent.cow_chain_rush.desc=_+1/+2/+3/+4：_万蹄奔雷每击中一个敌人，返还_1/2/3/4点护甲能量_。\n\n每次施放最多返还_12点_，不会超过护甲能量上限。
actors.hero.talent.cow_wide_pasture.title=牧场扩建
actors.hero.talent.cow_wide_pasture.desc=方寸牧场的基础半径为2格。\n\n_+1/+2/+3/+4：_持续时间延长_2/4/6/8回合_，半径分别增加_0/1/1/2格_。
actors.hero.talent.cow_living_fence.title=活篱笆
actors.hero.talent.cow_living_fence.desc=_+1/+2/+3/+4：_方寸牧场持续期间，每次脉冲对范围内的敌人造成_1/2/3/4点伤害_并施加减速。
actors.hero.talent.cow_restful_field.title=安心打个盹
actors.hero.talent.cow_restful_field.desc=_+1/+2/+3/+4：_方寸牧场每3回合为场内的你和友方额外补充_1/2/3/4点守牧护盾_。\n\n补充不会超过牧场初次提供的护盾量。
actors.hero.talent.cow_long_night.title=今晚不困
actors.hero.talent.cow_long_night.desc=_+1/+2/+3/+4：_夜半开工的持续时间增加_2/4/6/8回合_。
actors.hero.talent.cow_solar_flare.title=眉间一点光
actors.hero.talent.cow_solar_flare.desc=_+1/+2/+3/+4：_夜半开工期间，每次有效命中敌人的附加伤害再增加_1/2/3/4点_。
actors.hero.talent.cow_dawn_bringer.title=替你等天亮
actors.hero.talent.cow_dawn_bringer.desc=_+1/+2/+3/+4：_开启夜半开工时，获得_3/6/9/12点守牧护盾_，并清除自身的_燃烧和中毒_。

items.armor.cowarmor.name=星牧战铠
items.armor.cowarmor.desc=矮人王的皇冠化作一片片星纹甲叶，围住小牛那颗不肯认输的心。\n\n这件战铠保留原护甲的防御能力，并能够驱动万蹄奔雷、方寸牧场或夜半开工中的一项英雄技能。
items.remains.crackedbell.name=裂纹牛铃
items.remains.crackedbell.desc=一只留下细小裂纹的牛铃。铃舌已经松了，却还会轻轻响一声，像在提醒你：慢一点也没关系，别停下来。\n\n使用时，获得相当于最大生命值五分之一的临时护盾，然后牛铃化为星屑。
items.remains.crackedbell.ac_use=再响一声

actors.mobs.npcs.wandmaker.intro_cow=“等等……牛也开始下地牢了？好吧，只要别把我的法杖当磨角石就行。\n\n”
actors.mobs.npcs.blacksmith.intro_quest_cow=“喂，长角的！俺这儿修装备，不修脾气。……倒是你那对角，看起来挺适合开矿。”
actors.mobs.npcs.vaultmirror.scene_cow=镜中的牛不再皱着眉。它坐在明亮的桌角旁，面前的计算已经收敛，杯里的牛奶还温着。\n\n你伸蹄碰了碰镜面，镜中的它却又摆回那副熟悉的不服气表情。它把一副闪亮的犟角推了过来，像是在说：“拿去。回来再一起发呆。”

badges$badge.mastery_cow.title=犟牛专精
badges$badge.mastery_cow.desc=犟牛选择了自己的转职路线。
badges$badge.boss_slain_1_cow.title=初生牛犊
badges$badge.boss_slain_1_cow.desc=以犟牛击败第一位首领。
badges$badge.victory_cow.title=牛气归来
badges$badge.victory_cow.desc=以犟牛取得胜利。
badges$badge.boss_slain_3_bulldozer.title=山也让路
badges$badge.boss_slain_3_bulldozer.desc=以撼地蛮牛击败第三位首领。
badges$badge.boss_slain_3_herdguard.title=守住星光
badges$badge.boss_slain_3_herdguard.desc=以守夜牧卫击败第三位首领。
